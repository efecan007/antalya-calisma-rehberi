name: Keep backend awake

# Render ücretsiz planı 15 dk trafik almazsa servisi uykuya alır ve sonraki istek
# 30-60 sn cold start yaşar. Bu iş, backend'in /api/health ucuna düzenli ping atarak
# servisi uyanık tutar. (Not: GitHub cron zamanlaması gecikebilir; kritik kullanımda
# UptimeRobot gibi bir dış pinger daha güvenilirdir. Public repo olduğu için Actions
# dakikaları ücretsizdir.)

on:
  schedule:
    - cron: '*/5 * * * *' # her 5 dakikada bir (best-effort; GitHub gecikmeleri olabilir)
  workflow_dispatch: {} # gerektiğinde elle tetikleme

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Ping: $(date -u)"
          # Cold start'ta yanıt 60 sn'ye kadar sürebilir; -f ile HTTP hatalarında başarısız ol.
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            https://antalya-calisma-rehberi.onrender.com/api/health
          echo ""
          echo "OK"

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Remote Rehber</title>

    <!-- PWA / kurulabilir uygulama -->
    <meta name="theme-color" content="#0f9d78" />
    <meta name="description" content="Remote çalışanlar için mekan rehberi, sosyal akış ve iş ilanları." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS: ana ekrandan açınca tam ekran (standalone) çalışsın -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Çalışma Rehberi" />
    <script>
      // Tema, React yüklenmeden ÖNCE uygulanır; böylece sayfa yenilenince
      // gündüz temasının bir an görünüp gece temasına atlaması (flash) yaşanmaz.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
